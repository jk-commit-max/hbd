<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSpidey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="50%" stop-color="#D90429"/>
      <stop offset="100%" stop-color="#1D3557"/>
    </linearGradient>
    <filter id="spideyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Card Background -->
  <rect width="400" height="300" rx="24" fill="url(#bgSpidey)"/>

  <!-- Subtle Web Patterns -->
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" fill="none">
    <ellipse cx="200" cy="130" rx="40" ry="40" />
    <ellipse cx="200" cy="130" rx="75" ry="75" />
    <ellipse cx="200" cy="130" rx="115" ry="115" />
    <line x1="200" y1="15" x2="200" y2="245" />
    <line x1="85" y1="130" x2="315" y2="130" />
    <line x1="118" y1="48" x2="282" y2="212" />
    <line x1="118" y1="212" x2="282" y2="48" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="200" cy="130" r="65" fill="rgba(255,255,255,0.12)" filter="url(#spideyGlow)"/>

  <!-- Spider-Man Mask Icon / Silhouette -->
  <!-- Mask Head Base -->
  <path d="M 162 100 C 160 145, 175 175, 200 178 C 225 175, 240 145, 238 100 C 238 68, 222 55, 200 55 C 178 55, 162 68, 162 100 Z" fill="#D90429" stroke="#900C3F" stroke-width="2.5" />
  
  <!-- Left Eye -->
  <path d="M 174 95 C 182 100, 192 112, 194 125 C 188 126, 176 120, 170 108 C 168 100, 170 96, 174 95 Z" fill="#FFFFFF" stroke="#1D3557" stroke-width="3" />
  <!-- Right Eye -->
  <path d="M 226 95 C 218 100, 208 112, 206 125 C 212 126, 224 120, 230 108 C 232 100, 230 96, 226 95 Z" fill="#FFFFFF" stroke="#1D3557" stroke-width="3" />

  <!-- Persona Pill -->
  <rect x="110" y="215" width="180" height="34" rx="17" fill="rgba(255,255,255,0.92)"/>
  <text x="200" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#1D3557" text-anchor="middle" letter-spacing="0.05em">SPIDER-MAN 🕷️</text>
</svg>
