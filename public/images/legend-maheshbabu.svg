<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMahesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F"/>
      <stop offset="50%" stop-color="#F09819"/>
      <stop offset="100%" stop-color="#701004"/>
    </linearGradient>
    <linearGradient id="glassLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="24" fill="url(#bgMahesh)"/>

  <!-- Cinema Spotlights & Star Aura -->
  <circle cx="200" cy="125" r="70" fill="rgba(255, 235, 150, 0.22)" filter="url(#starGlow)"/>
  
  <!-- Flying flower petals / Poolakundi kick reference -->
  <path d="M 90 90 Q 100 70 110 85 Q 115 105 90 90 Z" fill="#FFE066" opacity="0.75" />
  <path d="M 310 80 Q 325 60 330 80 Q 330 100 310 80 Z" fill="#FFCAD4" opacity="0.8" />
  <path d="M 80 180 Q 95 160 105 175 Q 105 195 80 180 Z" fill="#FFE066" opacity="0.65" />
  <path d="M 320 170 Q 335 150 340 170 Q 340 190 320 170 Z" fill="#FF85A1" opacity="0.7" />

  <!-- The Legendary Poolakundi (Flowerpot) Icon with kick dust -->
  <g transform="translate(295, 115) scale(0.65)">
    <!-- Flowerpot -->
    <polygon points="10,40 50,40 42,75 18,75" fill="#D35400" stroke="#BA4A00" stroke-width="2" />
    <!-- Plant & Flowers -->
    <path d="M 30 40 Q 20 20 15 25" stroke="#27AE60" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 30 40 Q 30 15 35 18" stroke="#2ECC71" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 30 40 Q 45 20 48 26" stroke="#27AE60" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="15" cy="22" r="5" fill="#E74C3C" />
    <circle cx="35" cy="16" r="5" fill="#F1C40F" />
    <circle cx="48" cy="24" r="5" fill="#9B59B6" />
    <!-- Impact lines (kick effect) -->
    <line x1="-5" y1="45" x2="-18" y2="40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="-3" y1="58" x2="-16" y2="62" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="-24" y="25" font-size="14">💥</text>
  </g>

  <!-- Superstar Mahesh Babu Silhouette -->
  <!-- Stylish Hair -->
  <path d="M 160 88 C 158 60, 180 48, 200 48 C 222 48, 244 58, 242 88 C 248 100, 240 115, 235 120 C 235 105, 232 90, 222 88 C 210 86, 185 86, 178 88 C 168 90, 165 105, 165 120 C 160 115, 154 100, 160 88 Z" fill="#1C1412" />

  <!-- Face structure -->
  <path d="M 168 95 C 168 135, 180 155, 200 158 C 220 155, 232 135, 232 95 Z" fill="#FAD7A0" />

  <!-- Superstar Aviator Sunglasses -->
  <g>
    <!-- Left Lens -->
    <path d="M 172 102 C 172 98, 182 98, 194 100 C 195 112, 192 124, 184 125 C 176 124, 172 114, 172 102 Z" fill="url(#glassLens)" stroke="#FFD700" stroke-width="2" />
    <!-- Right Lens -->
    <path d="M 206 100 C 218 98, 228 98, 228 102 C 228 114, 224 124, 216 125 C 208 124, 205 112, 206 100 Z" fill="url(#glassLens)" stroke="#FFD700" stroke-width="2" />
    <!-- Bridge -->
    <line x1="194" y1="104" x2="206" y2="104" stroke="#FFD700" stroke-width="2.5" />
    <!-- Lens Reflection Glint -->
    <line x1="176" y1="104" x2="182" y2="120" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="210" y1="104" x2="216" y2="120" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Charming Smirk -->
  <path d="M 192 138 Q 200 144 210 139" fill="none" stroke="#A04000" stroke-width="2" stroke-linecap="round" />

  <!-- Collar / Shirt -->
  <path d="M 165 158 L 150 185 L 250 185 L 235 158 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- Superstar Badge Pill -->
  <rect x="85" y="215" width="230" height="34" rx="17" fill="rgba(255,255,255,0.95)" filter="url(#starGlow)"/>
  <text x="200" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#701004" text-anchor="middle" letter-spacing="0.06em">SUPERSTAR MAHESH BABU 😎</text>
</svg>
