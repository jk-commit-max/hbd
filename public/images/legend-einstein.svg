<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEinstein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="50%" stop-color="#34495e"/>
      <stop offset="100%" stop-color="#1abc9c"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Blackboard style background -->
  <rect width="400" height="300" rx="24" fill="url(#bgEinstein)"/>

  <!-- Chalk formulas in background -->
  <g fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5">
    <!-- Atom rings -->
    <ellipse cx="200" cy="130" rx="70" ry="24" transform="rotate(30 200 130)" />
    <ellipse cx="200" cy="130" rx="70" ry="24" transform="rotate(-30 200 130)" />
    <ellipse cx="200" cy="130" rx="70" ry="24" transform="rotate(90 200 130)" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="200" cy="130" r="60" fill="rgba(255,255,255,0.1)" filter="url(#softGlow)"/>

  <!-- E=mc^2 Chalk Note -->
  <text x="75" y="70" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="bold" fill="rgba(255,255,255,0.35)">E = mc²</text>
  <text x="305" y="70" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="bold" fill="rgba(255,255,255,0.35)">λ = h/p</text>

  <!-- Albert Einstein Face Silhouette & Icon -->
  <!-- Wild Hair Cloud -->
  <path d="M 150 115 C 135 105, 138 85, 155 78 C 158 60, 185 50, 200 50 C 215 50, 242 60, 245 78 C 262 85, 265 105, 250 115 C 260 135, 245 155, 235 150 C 225 150, 220 160, 200 160 C 180 160, 175 150, 165 150 C 155 155, 140 135, 150 115 Z" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2" />
  
  <!-- Face -->
  <ellipse cx="200" cy="120" rx="26" ry="28" fill="#FFD5C2" />
  
  <!-- Mustache -->
  <path d="M 188 128 Q 194 135 200 132 Q 206 135 212 128 Q 200 138 188 128 Z" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5" />
  
  <!-- Eyes & Eyebrows -->
  <circle cx="192" cy="115" r="2.5" fill="#2C3E50" />
  <circle cx="208" cy="115" r="2.5" fill="#2C3E50" />
  <path d="M 186 108 Q 192 105 198 108" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 202 108 Q 208 105 214 108" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Persona Pill Badge -->
  <rect x="95" y="215" width="210" height="34" rx="17" fill="rgba(255,255,255,0.95)"/>
  <text x="200" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#2C3E50" text-anchor="middle" letter-spacing="0.05em">ALBERT EINSTEIN 🧠</text>
</svg>
