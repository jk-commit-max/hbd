<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="100%" stop-color="#FF7EB3"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#bgHero)"/>
  <circle cx="200" cy="150" r="90" fill="rgba(255,255,255,0.18)" filter="url(#softGlow)"/>
  <circle cx="200" cy="130" r="54" fill="rgba(255,255,255,0.25)"/>
  <text x="200" y="148" font-size="64" text-anchor="middle" dominant-baseline="middle">🦸‍♂️</text>
  <rect x="110" y="210" width="180" height="34" rx="17" fill="rgba(255,255,255,0.85)"/>
  <text x="200" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#2D2320" text-anchor="middle">THE SUPERHERO</text>
</svg>
